<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurz innehalten. Sicher weiterarbeiten.</title>
<style>
{base_css}
.card{{
  max-width:820px;
  padding:58px;
  text-align:center;
}}
.lead{{
  margin:0 auto;
}}
.rules{{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin:30px 0 0;
}}
.rule{{
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#f8faff;
  font-weight:750;
}}
.claim{{
  margin-top:28px;
  font-size:19px;
  font-weight:850;
  color:var(--text);
}}
.actions{{
  justify-content:center;
}}
</style>
</head>
<body>
<main class="card">
  <div class="badge">✨ Externe KI-Seite</div>
  <h1>Kurz innehalten. Sicher weiterarbeiten.</h1>
  <p class="lead">Sie öffnen gerade ein externes KI-Tool.</p>

  <div class="rules">
    <div class="rule">🔒 Keine vertraulichen Informationen</div>
    <div class="rule">👤 Keine personenbezogenen Daten</div>
    <div class="rule">✅ Ergebnisse prüfen</div>
  </div>

  <p class="claim">KI kann unterstützen. Die Verantwortung bleibt bei Ihnen.</p>

  <div class="actions">
    <a class="btn primary" href="#">Zum KI-Hub</a>
    <a class="btn secondary" href="#">Weiter zum KI-Tool</a>
  </div>
</main>
</body>
</html>
